name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'packaging/windows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install . 'pyinstaller>=6.12,<7'
          if (!(Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              !(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress --version=6.7.4
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup' }
          }
      - name: Bundle app and compile installer
        run: ./packaging/windows/build.ps1
      - name: Install, launch and uninstall
        run: ./packaging/windows/test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PlotFolio-Windows-x64
          path: |
            dist/installer/*-Setup.exe
            dist/installer/*-Setup.exe.sha256
          if-no-files-found: error
