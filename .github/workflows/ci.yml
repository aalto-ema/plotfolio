name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python tests/ui_smoke.py
      - run: python tests/ui_interactions.py
      - run: python tests/ui_legends.py
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -c "import plotfolio; import importlib.resources as r; assert r.files('plotfolio.ui').joinpath('icons/chevron.svg').is_file()"
