[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "plotfolio"
version = "0.5.0"
description = "A desktop studio for publication-quality scientific figures"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "PlotFolio contributors"}]
dependencies = [
  "matplotlib>=3.8,<4", "numpy>=1.26,<3", "PySide6>=6.7,<7",
  "scipy>=1.11,<2", "openpyxl>=3.1,<4",
  "pillow>=10,<13", "pypdf>=5,<7", "reportlab>=4,<6",
]

[project.urls]
Homepage = "https://github.com/aalto-ema/plotfolio"
Issues = "https://github.com/aalto-ema/plotfolio/issues"

[project.optional-dependencies]
dev = ["ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
plotfolio = "plotfolio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"plotfolio.ui" = ["icons/*.svg"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F403", "F405"]
